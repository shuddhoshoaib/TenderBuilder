<html lang="en"><head><meta charset="utf-8">

<title>Tender Package Builder</title>

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f5f6f8;--card:#fff;--tx:#1b2430;--mut:#64707f;--bd:#d9dee5;--ac:#1f5fbf;--ok:#16794a;--bad:#b3261e;--warn:#9a6700;--okb:#e3f5ea;--badb:#fde8e6;--warnb:#fff3d6;--mutb:#eceff3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181e;--card:#1d232b;--tx:#e8ecf1;--mut:#94a0ae;--bd:#333c47;--ac:#6ea3f5;--ok:#58d08f;--bad:#ff8b82;--warn:#f0c04f;--okb:#12301f;--badb:#3a1a18;--warnb:#3a2f10;--mutb:#2a323c}}
:root[data-theme="dark"]{--bg:#14181e;--card:#1d232b;--tx:#e8ecf1;--mut:#94a0ae;--bd:#333c47;--ac:#6ea3f5;--ok:#58d08f;--bad:#ff8b82;--warn:#f0c04f;--okb:#12301f;--badb:#3a1a18;--warnb:#3a2f10;--mutb:#2a323c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,"Noto Sans Bengali","Nirmala UI","Segoe UI",sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
h1{font-size:20px;margin:0}h2{font-size:16px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin:12px 0}
button,select,input{font:inherit;color:var(--tx)}
button{background:var(--ac);color:#fff;border:0;border-radius:6px;padding:8px 14px;cursor:pointer}
button.sec{background:var(--mutb);color:var(--tx)}button.sm{padding:3px 9px;font-size:13px}
button:disabled{opacity:.45;cursor:not-allowed}
select,input[type=date]{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:6px;max-width:100%}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px 16px}
.meta b{display:block;font-size:12px;color:var(--mut);font-weight:500}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:640px}
th,td{text-align:start;padding:8px 6px;border-bottom:1px solid var(--bd);vertical-align:middle}th{font-size:12px;color:var(--mut)}
.st{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:600;white-space:nowrap}
.OK{background:var(--okb);color:var(--ok)}.Missing,.Expired,.Needed{background:var(--badb);color:var(--bad)}.NotProvided{background:var(--mutb);color:var(--mut)}
.tag{font-size:12px;padding:1px 7px;border-radius:5px;background:var(--warnb);color:var(--warn);margin-inline-start:6px}
.file{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.err{background:var(--badb);color:var(--bad);padding:8px 12px;border-radius:6px;margin:6px 0}
.mut{color:var(--mut)}ul{margin:6px 0;padding-inline-start:20px}
.drop{border:2px dashed var(--bd);border-radius:10px;padding:18px;text-align:center}
</style></head><body><div class="wrap" id="app"></div>
<script>
const T={en:{title:"Tender Package Builder",step1:"1. Load tender requirements",loadReq:"Open requirements.json",tid:"Tender ID",ttl:"Title",ent:"Procuring entity",bid:"Bidder",dl:"Submission deadline",step2:"2. Upload PDF files",drop:"Choose PDF files (up to 30 files, 50 MB total)",remove:"Remove",pages:"pages",dup:"Duplicate of",step3:"3. Match files and enter expiry dates",doc:"Document",req:"Required",opt:"Optional",file:"File",none:"— none —",exp:"Expiry date",status:"Status",Missing:"Missing",Needed:"Expiry date needed",Expired:"Expired",NotProvided:"Not provided",OK:"OK",gen:"Generate package",download:"Download",why:"Cannot generate yet:",ready:"All checks passed. You can generate the package.",notPdf:"is not a PDF and was rejected.",bad:"could not be read (damaged or password-protected) and was rejected.",limit:"Limit exceeded (30 files / 50 MB). Not added:",badReq:"This is not a valid requirements file.",undo:"Undo",loadFirst:"Please open requirements.json first.",building:"Building…",done:"Package ready:",sameFile:"Same content as another file; it can only be used for one document.",lang:"বাংলা",am:"ফাইল নাম দেখে মিলান",csv:"CSV এক্সপোর্ট",save:"প্রজেক্ট সেভ",open:"প্রজেক্ট খুলুন",idx:"কভারের পরে সূচিপত্র পৃষ্ঠা যোগ করুন",seal:"সিল/স্বাক্ষর (PNG)",sealPages:"কোন পৃষ্ঠায় (যেমন all বা 1,3-5):",missingF:"ফাইল আপলোড করা নেই:",badPng:"এটি PNG ছবি নয়।",wrongProj:"এই প্রজেক্ট ফাইল অন্য টেন্ডারের।",auto:"PDF থেকে স্বয়ংক্রিয়ভাবে পাওয়া",manual:"PDF-এ মেয়াদ পাওয়া যায়নি — নিজে লিখুন",hint:"Open the requirements.json file from the sample pack to start."},
bn:{title:"টেন্ডার প্যাকেজ বিল্ডার",step1:"১. টেন্ডারের চাহিদা লোড করুন",loadReq:"requirements.json খুলুন",tid:"টেন্ডার আইডি",ttl:"শিরোনাম",ent:"ক্রয়কারী প্রতিষ্ঠান",bid:"দরদাতা",dl:"জমাদানের শেষ তারিখ",step2:"২. PDF ফাইল আপলোড করুন",drop:"PDF ফাইল বাছাই করুন (সর্বোচ্চ ৩০টি, মোট ৫০ MB)",remove:"মুছুন",pages:"পৃষ্ঠা",dup:"ডুপ্লিকেট:",step3:"৩. ফাইল মিলান ও মেয়াদ দিন",doc:"নথি",req:"আবশ্যক",opt:"ঐচ্ছিক",file:"ফাইল",none:"— কিছু নয় —",exp:"মেয়াদ শেষের তারিখ",status:"অবস্থা",Missing:"অনুপস্থিত",Needed:"মেয়াদ প্রয়োজন",Expired:"মেয়াদোত্তীর্ণ",NotProvided:"দেওয়া হয়নি",OK:"ঠিক আছে",gen:"প্যাকেজ তৈরি করুন",download:"ডাউনলোড",why:"এখনো তৈরি করা যাচ্ছে না:",ready:"সব ঠিক আছে। এখন প্যাকেজ তৈরি করতে পারেন।",notPdf:"PDF নয়, তাই বাদ দেওয়া হয়েছে।",bad:"পড়া যায়নি (নষ্ট বা পাসওয়ার্ড দেওয়া), তাই বাদ দেওয়া হয়েছে।",limit:"সীমা অতিক্রম (৩০টি ফাইল / ৫০ MB)। যোগ হয়নি:",badReq:"এটি সঠিক requirements ফাইল নয়।",undo:"পূর্বাবস্থা",loadFirst:"আগে requirements.json খুলুন।",building:"তৈরি হচ্ছে…",done:"প্যাকেজ প্রস্তুত:",sameFile:"অন্য ফাইলের হুবহু কপি; শুধু একটি নথির জন্য ব্যবহার করা যাবে।",lang:"English",am:"Suggest matches by file name",csv:"Export CSV",save:"Save project",open:"Open project",idx:"Add an index page after the cover",seal:"Seal / signature (PNG)",sealPages:"On which pages (e.g. all or 1,3-5):",missingF:"File not uploaded:",badPng:"That is not a PNG image.",wrongProj:"This project file belongs to a different tender.",auto:"auto-detected from the PDF",manual:"Not found in the PDF — please enter it",hint:"শুরু করতে স্যাম্পল প্যাকের requirements.json ফাইলটি খুলুন।"}};
let lang="en",tender=null,reqs=[],files=[],match={},expiry={},errors=[],result=null,busy=false,seq=0,autoSet={},opts={index:true},seal={bytes:null,pages:"all",size:90};
const t=k=>T[lang][k],$=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nm=r=>lang==="bn"?(r.title_bn||r.title_en):(r.title_en||r.title_bn);
const fileById=id=>files.find(f=>f.id===id);
const usedBy=fid=>Object.keys(match).find(r=>match[r]===fid);
function dupOf(f){return files.find(g=>g.id!==f.id&&g.hash===f.hash&&g.id<f.id)}
function allowed(f,rid){ // may file f be chosen for requirement rid?
 if(match[rid]===f.id)return true;
 return !files.some(g=>g.hash===f.hash&&usedBy(g.id)&&usedBy(g.id)!==rid);

function status(r){
 const f=match[r.id];
 if(!f)return r.mandatory?"Missing":"NotProvided";
 if(r.has_expiry){const e=expiry[r.id];if(!e)return"Needed";if(e<tender.submission_deadline)return"Expired";}
 return"OK";
}
const blocking=s=>["Missing","Needed","Expired"].includes(s);
function render(){
 const A=$("#app");
 let h=`<header><h1>${t("title")}</h1><button class="sec" onclick="lang=lang==='en'?'bn':'en';render()">${t("lang")}</button></header>`;
 h+=`<div class="card"><h2>${t("step1")}</h2><input type="file" accept=".json,application/json" onchange="loadReq(this.files[0]);this.value=''">`;
 if(!tender)h+=`<p class="mut">${t("hint")}</p>`;
 else h+=`<div class="meta" style="margin-top:10px">${[["tid",tender.tender_id],["ttl",tender.title],["ent",tender.procuring_entity],["bid",tender.bidder],["dl",tender.submission_deadline]].map(([k,v])=>`<div><b>${t(k)}</b>${esc(v)}</div>`).join("")}</div>`;
 h+=`</div>`;
 h+=`<div class="card"><h2>${t("step2")}</h2><div class="drop"><input type="file" multiple accept="application/pdf,.pdf" onchange="addFiles([...this.files]);this.value=''"><p class="mut" style="margin:6px 0 0">${t("drop")}</p></div>`;
 h+=errors.map(e=>`<div class="err">${esc(e)}</div>`).join("");
 h+=files.map(f=>{const d=dupOf(f);return`<div class="file"><span>📄 ${esc(f.name)} <span class="mut">· ${f.pages} ${t("pages")}</span>${d?`<span class="tag" title="${t("sameFile")}">⚠ ${t("dup")} ${esc(d.name)}</span>`:""}</span><button class="sec sm" onclick="rmFile(${f.id})">${t("remove")}</button></div>`}).join("");
 h+=`</div>`;
 if(tender){
  h+=`<div class="card"><h2>${t("step3")}</h2><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px"><button class="sec sm" onclick="autoMatch()">✨ ${t("am")}</button><button class="sec sm" onclick="exportCsv()">${t("csv")}</button><button class="sec sm" onclick="saveProject()">${t("save")}</button><label class="mut" style="font-size:13px">${t("open")}: <input type="file" accept=".json" onchange="openProject(this.files[0]);this.value=''"></label></div><div class="scroll"><table><tr><th>#</th><th>${t("doc")}</th><th>${t("file")}</th><th>${t("exp")}</th><th>${t("status")}</th></tr>`;
  const why=[];
  reqs.forEach(r=>{
   const s=status(r);if(blocking(s))why.push(`${nm(r)} — ${t(s)}`);
   const opts=files.map(f=>{const ok=allowed(f,r.id),u=usedBy(f.id);return`<option value="${f.id}" ${match[r.id]===f.id?"selected":""} ${ok&&(!u||u===r.id)?"":"disabled"}>${esc(f.name)}</option>`}).join("");
   h+=`<tr><td>${r.order}</td><td><b>${esc(nm(r))}</b><br><span class="mut">${r.mandatory?t("req"):t("opt")}</span></td>
   <td><select onchange="setMatch('${r.id}',this.value)"><option value="">${t("none")}</option>${opts}</select>${match[r.id]?` <button class="sec sm" onclick="setMatch('${r.id}','')">${t("undo")}</button>`:""}</td>
   <td>${r.has_expiry&&match[r.id]?`<input type="date" value="${expiry[r.id]||""}" onchange="setExp('${r.id}',this.value)"><div class="mut" style="font-size:12px">${autoSet[r.id]?"✓ "+t("auto"):(expiry[r.id]?"":t("manual"))}</div>`:`<span class="mut">${r.has_expiry?"":"–"}</span>`}</td>
   <td><span class="st ${s}">${t(s)}</span></td></tr>`;
  });
  h+=`</table></div></div><div class="card">`;
  h+=why.length?`<b>${t("why")}</b><ul>${why.map(w=>`<li>${esc(w)}</li>`).join("")}</ul>`:`<p style="color:var(--ok);margin:0 0 8px">✔ ${t("ready")}</p>`;
  h+=`<div style="margin:10px 0"><label><input type="checkbox" ${opts.index?"checked":""} onchange="opts.index=this.checked;result=null;render()"> ${t("idx")}</label></div>
  <div style="margin:10px 0"><b>${t("seal")}</b> <input type="file" accept="image/png" onchange="loadSeal(this.files[0]);this.value=''"> ${seal.bytes?`<button class="sec sm" onclick="seal.bytes=null;result=null;render()">${t("remove")}</button><div style="margin-top:6px">${t("sealPages")} <input value="${esc(seal.pages)}" size="14" onchange="seal.pages=this.value;result=null;render()"></div>`:""}</div>`;
  h+=`<button ${why.length||busy?"disabled":""} onclick="generate()">${busy?t("building"):t("gen")}</button>`;
  if(result)h+=` <button class="sec" onclick="download()">⬇ ${t("download")} ${esc(result.name)}</button>`;
  h+=`</div>`;
 }
 const act=document.activeElement;A.innerHTML=h;
}
async function loadReq(f){
 if(!f)return;errors=[];
 try{const j=JSON.parse(await f.text());
  if(!j.tender||!Array.isArray(j.requirements))throw 0;
  tender=j.tender;reqs=[...j.requirements].sort((a,b)=>a.order-b.order);match={};expiry={};result=null;
 }catch(e){errors=[t("badReq")]}
 render();
}
async function addFiles(list){
 errors=[];result=null;
 for(const f of list){
  const total=files.reduce((s,x)=>s+x.size,0);
  if(files.length>=30||total+f.size>50*1024*1024){errors.push(`${t("limit")} ${f.name}`);continue}
  try{
   const buf=new Uint8Array(await f.arrayBuffer());
   const head=String.fromCharCode(...buf.slice(0,5));
   if(!/\.pdf$/i.test(f.name)&&f.type!=="application/pdf"||head!=="%PDF-"){errors.push(`${f.name} ${t("notPdf")}`);continue}
   let pages;
   try{pages=(await PDFLib.PDFDocument.load(buf)).getPageCount()}catch(e){errors.push(`${f.name} ${t("bad")}`);continue}
   const hash=[...new Uint8Array(await crypto.subtle.digest("SHA-256",buf))].map(b=>b.toString(16).padStart(2,"0")).join("");
   files.push({id:++seq,name:f.name,size:f.size,pages,hash,bytes:buf,autoExpiry:detectExpiry(await pdfText(buf))});
  }catch(e){errors.push(`${f.name} ${t("bad")}`)}
 }
 render();
}
function rmFile(id){files=files.filter(f=>f.id!==id);for(const r in match)if(match[r]===id){delete match[r];delete expiry[r]}result=null;render()}
function setMatch(rid,v){
 if(v){match[rid]=+v;const f=fileById(+v),r=reqs.find(x=>x.id===rid);
  if(r&&r.has_expiry){if(f&&f.autoExpiry){expiry[rid]=f.autoExpiry;autoSet[rid]=true}else{delete expiry[rid];delete autoSet[rid]}}}
 else{delete match[rid];delete expiry[rid];delete autoSet[rid]}
 result=null;render()}
function setExp(rid,v){expiry[rid]=v;delete autoSet[rid];result=null;render()}
const MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
const bnDig=s=>s.replace(/[\u09E6-\u09EF]/g,c=>c.charCodeAt(0)-0x09E6);
const iso=(y,m,d)=>{y=+y;m=+m;d=+d;if(y<100)y+=2000;if(m<1||m>12||d<1||d>31||y<1990||y>2100)return null;return y+"-"+String(m).padStart(2,"0")+"-"+String(d).padStart(2,"0")};
function findDates(s){
 const out=[],seen=new Set();let m;
 const rx=[
  [/\b(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})\b/g,a=>iso(a[1],a[2],a[3])],
  [/\b(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})\b/g,a=>{let d=+a[1],mo=+a[2];if(mo>12&&d<=12)[d,mo]=[mo,d];return iso(a[3],mo,d)}],
  [/\b(\d{1,2})(?:st|nd|rd|th)?[\s,-]+(?:of\s+)?([A-Za-z]{3,9})\.?,?[\s,-]+(\d{4})\b/g,a=>{const mo=MON[a[2].slice(0,3).toLowerCase()];return mo?iso(a[3],mo,a[1]):null}],
  [/\b([A-Za-z]{3,9})\.?\s+(\d{1,2})(?:st|nd|rd|th)?,?\s+(\d{4})\b/g,a=>{const mo=MON[a[1].slice(0,3).toLowerCase()];return mo?iso(a[3],mo,a[2]):null}]
 ];
 for(const [r,f] of rx){while(m=r.exec(s)){const v=f(m);if(v&&!seen.has(m.index)){seen.add(m.index);out.push({v,i:m.index,e:m.index+m[0].length})}}}
 return out.sort((a,b)=>a.i-b.i);
}
function detectExpiry(txt){
 txt=bnDig(txt||"").replace(/\s+/g," ");
 const K=/expir|valid\s*(until|till|up\s*to|upto|through|thru|to)|validity|renewal|due\s*date|\u09AE\u09C7\u09AF\u09BC\u09BE\u09A6|\u09AE\u09C7\u09DF\u09BE\u09A6/gi;
 const B=/issue|dated|\u0987\u09B8\u09CD\u09AF\u09C1|valid\s*from|effective|start/gi;
 const last=(re,s)=>{let i=-1,m;re.lastIndex=0;while(m=re.exec(s))i=m.index;return i};
 const ds=findDates(txt),c=[];
 ds.forEach((d,k)=>{
  const from=Math.max(k?ds[k-1].e:0,d.i-50),seg=txt.slice(from,d.i),after=txt.slice(d.e,d.e+20);
  const ki=last(K,seg),bi=last(B,seg);
  if(ki>bi||(k&&/^\s*(to|until|till|-|\u2013)\s*$/i.test(seg)&&/valid|period|from/i.test(txt.slice(Math.max(0,ds[k-1].i-40),ds[k-1].i)))||/^\s*[\(\[-]?\s*(expir|valid)/i.test(after))c.push(d.v);
 });
 return c.length?c.sort().pop():null;
}
async function pdfText(buf){
 if(!window.pdfjsLib)return"";
 try{
  pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const run=(async()=>{const doc=await pdfjsLib.getDocument({data:buf.slice()}).promise;let s="";
   for(let p=1;p<=Math.min(doc.numPages,30);p++){const c=await(await doc.getPage(p)).getTextContent();s+=c.items.map(i=>i.str).join(" ")+" "}return s})();
  return await Promise.race([run,new Promise(r=>setTimeout(()=>r(""),10000))]);
 }catch(e){return""}
}
const ascii=s=>String(s??"").replace(/[^\x20-\x7E]/g,"?");
async function generate(){
 busy=true;render();
 try{
  const {PDFDocument,StandardFonts,rgb}=PDFLib,out=await PDFDocument.create();
  const font=await out.embedFont(StandardFonts.Helvetica),bold=await out.embedFont(StandardFonts.HelveticaBold);
  const inc=reqs.filter(r=>match[r.id]),srcs=[];
  for(const r of inc){const f=fileById(match[r.id]);srcs.push({r,f,doc:await PDFDocument.load(f.bytes)})}
  const idx=opts.index?1:0,FH=32;let pg=2+idx;
  const starts=srcs.map(x=>{const st=pg;pg+=x.doc.getPageCount();return st}),total=pg-1;
  const cover=out.addPage([595,842]);let y=780;
  const fit=(s,fnt,sz,w)=>{s=ascii(s);while(s.length>3&&fnt.widthOfTextAtSize(s,sz)>w)s=s.slice(0,-2);return s};
  cover.drawText("TENDER DOCUMENT PACKAGE",{x:50,y,size:20,font:bold});y-=40;
  [["Tender ID",tender.tender_id],["Title",tender.title],["Procuring Entity",tender.procuring_entity],["Bidder",tender.bidder],["Submission Deadline",tender.submission_deadline],["Package Created",new Date().toISOString().slice(0,10)]].forEach(([k,v])=>{
   cover.drawText(k+":",{x:50,y,size:11,font:bold});cover.drawText(fit(v,font,11,370),{x:180,y,size:11,font});y-=20});
  y-=14;cover.drawText("Included Documents",{x:50,y,size:13,font:bold});y-=22;
  srcs.forEach((x,i)=>{if(y>70){cover.drawText(fit(`${i+1}. ${x.r.title_en||x.r.id}`,font,11,495),{x:60,y,size:11,font});y-=17}});
  const addFooter=(p,n)=>{const s=`${tender.tender_id} | Page ${n} of ${total}`,w=font.widthOfTextAtSize(ascii(s),9);
   p.drawText(ascii(s),{x:(p.getWidth()-w)/2,y:11,size:9,font,color:rgb(.15,.15,.15)})};
  const sealImg=seal.bytes?await out.embedPng(seal.bytes):null,sp=parsePages(seal.pages,total);
  const doSeal=(p,num)=>{if(sealImg&&sp.has(num)){const w=seal.size,h=w*sealImg.height/sealImg.width;p.drawImage(sealImg,{x:p.getWidth()-w-20,y:FH+10,width:w,height:h})}};
  addFooter(cover,1);doSeal(cover,1);let n=1;
  if(idx){const ip=out.addPage([595,842]);let iy=780;ip.drawText("INDEX",{x:50,y:iy,size:20,font:bold});iy-=36;
   srcs.forEach((x,i)=>{const l=fit(`${i+1}. ${x.r.title_en||x.r.id}`,font,11,400),pn=String(starts[i]);
    ip.drawText(l,{x:55,y:iy,size:11,font});const pw=font.widthOfTextAtSize(pn,11);ip.drawText(pn,{x:540-pw,y:iy,size:11,font});
    const lw=font.widthOfTextAtSize(l,11);ip.drawLine({start:{x:60+lw,y:iy+3},end:{x:530-pw,y:iy+3},thickness:.5,color:rgb(.6,.6,.6),dashArray:[1,2]});iy-=20});
   addFooter(ip,++n);doSeal(ip,n)}
  for(const x of srcs){
   const emb=await out.embedPages(x.doc.getPages());
   for(const e of emb){const p=out.addPage([e.width,e.height+FH]);p.drawPage(e,{x:0,y:FH});addFooter(p,++n);doSeal(p,n)}
  }
  const bytes=await out.save();
  result={name:`${tender.tender_id}_Package.pdf`,bytes};
 }catch(e){errors=["Error: "+e.message]}
 busy=false;render();
}
async function saveBlob(name,blob){
 try{const d=await claude.use("downloads");if(d){await d.save({filename:name,data:blob});return}}catch(e){}
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();
}
function download(){saveBlob(result.name,new Blob([result.bytes],{type:"application/pdf"}))}
function parsePages(str,total){
 const s=new Set(),v=(str||"").trim().toLowerCase();
 if(v==="all"){for(let i=1;i<=total;i++)s.add(i);return s}
 v.split(/[,\s]+/).forEach(p=>{const m=p.match(/^(\d+)(?:-(\d+))?$/);if(m)for(let i=+m[1];i<=+(m[2]||m[1]);i++)s.add(i)});
 return s;
}
async function loadSeal(f){
 if(!f)return;errors=[];const b=new Uint8Array(await f.arrayBuffer());
 if(b[0]!==0x89||b[1]!==0x50||b[2]!==0x4E||b[3]!==0x47)errors=[t("badPng")];else{seal.bytes=b;result=null}
 render();
}
function autoMatch(){
 const stop=new Set(["the","and","for","of","certificate","letter","document","copy","pdf"]);
 const tok=x=>(x||"").toLowerCase().replace(/\.pdf$/,"").split(/[^a-z0-9]+/).filter(w=>w&&!stop.has(w));
 const pairs=[];
 reqs.forEach(r=>{if(match[r.id])return;const rt=tok(r.title_en).filter(w=>w.length>1);
  files.forEach(f=>{const ft=tok(f.name);let sc=rt.filter(w=>ft.includes(w)).length;if(ft.includes(r.id.toLowerCase()))sc+=3;if(sc)pairs.push({r,f,sc})})});
 pairs.sort((a,b)=>b.sc-a.sc).forEach(({r,f})=>{if(!match[r.id]&&!usedBy(f.id)&&allowed(f,r.id))setMatch(r.id,String(f.id))});
 render();
}
function exportCsv(){
 const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
 const rows=[["Order","Document (EN)","Document (BN)","Mandatory","File","Pages","Expiry date","Status"]];
 reqs.forEach(r=>{const f=fileById(match[r.id]);rows.push([r.order,r.title_en,r.title_bn,r.mandatory?"Yes":"No",f?f.name:"",f?f.pages:"",expiry[r.id]||"",T.en[status(r)]||status(r)])});
 saveBlob((tender.tender_id||"tender")+"_Checklist.csv",new Blob(["\ufeff"+rows.map(r=>r.map(q).join(",")).join("\r\n")],{type:"text/csv"}));
}
function saveProject(){
 const m={};for(const r in match){const f=fileById(match[r]);if(f)m[r]=f.name}
 saveBlob((tender.tender_id||"tender")+"_project.json",new Blob([JSON.stringify({tender_id:tender.tender_id,match:m,expiry})],{type:"application/json"}));
}
async function openProject(f){
 if(!f||!tender)return;errors=[];
 try{const p=JSON.parse(await f.text());
  if(p.tender_id!==tender.tender_id){errors=[t("wrongProj")];return render()}
  for(const r in p.match){const file=files.find(x=>x.name===p.match[r]);
   if(!file||!reqs.some(q=>q.id===r)){errors.push(`${t("missingF")} ${p.match[r]}`);continue}
   if(allowed(file,r)&&!usedBy(file.id)){setMatch(r,String(file.id));if(p.expiry&&p.expiry[r]){expiry[r]=p.expiry[r];delete autoSet[r]}}}
 }catch(e){errors=[t("badReq")]}
 render();
}
render();
</script></body></html>
